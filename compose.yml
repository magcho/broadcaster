services:
  db:
    image: postgres:18
    container_name: broadcaster_db
    restart: always
    ports:
      - 5433:5432
    volumes:
      - broadcaster-db-store:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: broadcaster
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - broadcaster-mongodb-data:/data/db

volumes:
  broadcaster-db-store:
  broadcaster-mongodb-data:
